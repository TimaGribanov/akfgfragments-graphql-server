name: Build and deploy GraphQL data server

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

jobs:
  build:
    name: Build Kotlin app with GraalVM
    runs-on: ubuntu-latest

    outputs:
      filename: ${{ steps.get-filename.outputs.FILENAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

#      - name: Read package version
#        id: get-version
#        run: |
#          echo "BUILD_VERSION=$(grep -oP "version\s*=\s*'[^']+'" build.gradle.kts | grep -oP "[^']*" | tr -d '\n' | tr -d ' ' | tr -d 'version=')" >> "$GITHUB_OUTPUT"

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: 'graalvm'
          github-token: ${{ github.ACTION_TOKEN }}

      - name: Fix wrapper permission
        run: |
          chmod +x ./gradlew

      - name: Build fatJar
        run: |
          buildFatJar

      - name: Get fatJar's filename
        id: get-fatjar-filename
        run: |
          echo "FATJAR_FILENAME=$(ls build/libs | grep akfgfragments-data-graphql-server-fatJar)" >> $GITHUB_OUTPUT

      - name: Create reflection with the tracing agent
        run: |
          $JAVA_HOME/bin/java -agentlib:native-image-agent=config-output-dir=src/main/resources/META-INF/native-image/com.akfgfragments -jar build/libs/${{ steps.get-fatjar-filename.outputs.FATJAR_FILENAME }}

      - name: Build native image
        run: |
          ./gradlew nativeCompile

      - name: Get the filename
        id: get-filename
        run: |
          echo "FILENAME=$(ls build/native/nativeCompile | grep akfgfragments-data-graphql-server)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: 'built-app'
          path: build/native/nativeCompile/${{ steps.get-filename.outputs.FILENAME }}
          if-no-files-found: error

  deploy:
    name: Deploy the built app to the server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Define path
        id: define-path
        run: |
          if [ ${{ github.ref }} == 'refs/heads/main' ]; then
            echo "PATH=${{ secrets.DATA_SERVER_PATH }}" >> "$GITHUB_OUTPUT"
          else
            echo "PATH=${{ secrets.DATA_SERVER_PATH_TEST }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: built-app

      - name: Show current files
        run: |
          ls -a
          echo ${{ needs.build.outputs.filename }}

      - name: Copy to the server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: .
          target: ${{ steps.define-path.outputs.PATH }}

      - name: Change symlink and restart the app
        uses: garygrossgarten/github-action-ssh@release
        env:
          PATH: ${{ steps.define-path.outputs.PATH }}
          FILENAME: ${{ needs.build.outputs.filename }}
        with:
          command: |
            cd $PATH
            chmod +x $FILENAME
            ln -sfn $FILENAME data-server
            ./restart.sh
          host: ${{ secrets.IP }}
          username: ${{ secrets.USER }}
          privateKey: ${{ secrets.SSH_KEY }}